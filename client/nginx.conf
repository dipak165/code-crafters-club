server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets — this is a React SPA, JS/CSS bundles are the
    # bulk of what's served here.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API requests go to the backend container. In docker-compose, "server"
    # is the service name and resolves via Docker's internal DNS.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Needed for the refresh-token cookie to round-trip correctly.
        proxy_pass_header Set-Cookie;
    }

    # SPA fallback: any route not matched above (e.g. /events/some-slug on
    # a hard refresh) serves index.html so React Router can take over,
    # instead of nginx 404ing on a path it doesn't have a file for.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed build assets aggressively; never cache index.html
    # itself, so a new deploy is picked up on next load rather than served stale.
    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
