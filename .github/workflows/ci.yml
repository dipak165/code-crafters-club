name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Run permanent test suite
        run: npm test
        # No database needed — see server/__tests__/, which mocks Prisma
        # per-file rather than requiring a live Postgres instance. This
        # is why CI can run these on every push in seconds.

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Build (catches real errors — see README "Verification")
        run: npm run build

  prisma-schema-check:
    name: Prisma schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - name: Validate schema.prisma
        working-directory: server
        run: npx prisma validate --schema=../prisma/schema.prisma
        # GitHub Actions runners have normal internet access, so this
        # reaches binaries.prisma.sh fine — unlike the sandbox this
        # project was originally built in, which is why this check
        # could never be run during development (see README).
